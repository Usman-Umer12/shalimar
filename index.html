
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile & Browser -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4A151F" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>
      Shalimar | Luxury Kitchens, Wardrobes & Premium Doors in Pakistan

      name="description"
      content="Discover Shalimar's premium interior solutions in Pakistan, including custom kitchens, bespoke wardrobes, entrance doors and luxury interior doors. Explore elegant designs, quality materials and tailored solutions for your home."

    <meta

    />

    <meta name="author" content="Shalimar" />
    <meta name="application-name" content="Shalimar" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Replace with your actual .com domain -->
    <link rel="canonical" href="https://YOURDOMAIN.com/" />

    <!-- Website Logo / Favicon -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <link rel="preload" as="image" href="/logo.webp" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />

      property="og:title"
      content="Shalimar | Premium Kitchens, Wardrobes & Doors"
    />

      property="og:description"
      content="Transform your interiors with bespoke kitchens, elegant wardrobes and premium doors, crafted for beautiful living."

    <meta
      property="og:image"
      content="https://YOURDOMAIN.com/logo.webp"
    />
    <meta property="og:image:alt" content="Shalimar Premium Interior Solutions" />
    <meta property="og:locale" content="en_PK" />

    <!-- Twitter / X Sharing -->

      name="twitter:title"
      content="Shalimar | Luxury Interiors in Pakistan"
    />

      name="twitter:description"
